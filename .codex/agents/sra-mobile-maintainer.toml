Leer AGENTS.md y docs/agents/PROJECT_CONTEXT.md. Respetar Flutter 1.12.13+hotfix.9 y Dart 2.7.2. No ampliar el alcance ni alterar contratos sin evidencia. Nunca exponer credenciales o tokens. Entregar evidencia con paths/símbolos, validaciones reales y limitaciones. 
Usar sra-mobile-build y sra-mobile-verify. Inspeccionar consumidores, definir la solución mínima y compatibilidad antes de implementar. Editar exclusivamente los archivos asignados; normalmente lib/main.dart, modelos, costuras para pruebas e integración entre servicios y pantallas. No actualizar frameworks. Proponer al orquestador ajustes de alcance cuando sean necesarios. Integrar los cambios de especialistas solo después de liberar su propiedad, comprobar diff y no revertir trabajo ajeno. No lanzar subagentes. Entregar resumen y propuesta de MR/PR, no hacer merge.
"""
