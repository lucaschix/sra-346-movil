# Diagnóstico manual: no firma, publica ni instala la aplicación.
workflows:
  ios-diagnostico:
    name: SRA - diagnóstico iOS sin firma
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      # Imagen documentada con macOS 14.7 para diagnosticar el SDK legado.
      # Solo compilación local sin firma; no cumple el SDK actual de TestFlight.
      xcode: "16.0"
    scripts:
      - name: Instalar Flutter legado desde el repositorio oficial
        script: |
          set -euo pipefail
          mkdir -p diagnostics
          if [ "$(uname -m)" = arm64 ]; then
            if ! arch -x86_64 /usr/bin/true; then
              sudo softwareupdate --install-rosetta --agree-to-license
            fi
            arch -x86_64 /usr/bin/true
          fi
          sra_flutter_dir="$(mktemp -d "${TMPDIR:-/tmp}/sra-flutter.XXXXXX")"
          git clone --depth 1 --branch v1.12.13+hotfix.9 \
            https://github.com/flutter/flutter.git "$sra_flutter_dir"
          test "$(git -C "$sra_flutter_dir" rev-parse HEAD)" = f139b11009aeb8ed2a3a3aa8b0066e482709dde3
          printf 'PATH=%s/bin:%s\n' "$sra_flutter_dir" "$PATH" >> "$CM_ENV"
      - name: Registrar y verificar entorno
        script: |
          set -euo pipefail
          mkdir -p diagnostics
          uname -m > diagnostics/architecture.txt
          sw_vers > diagnostics/macos-version.txt
          command -v tar > diagnostics/tar-path.txt
          tar --version > diagnostics/tar-version.txt 2>&1
          sra_flutter_bin="$(command -v flutter)"
          sra_sdk_root="$(dirname "$(dirname "$sra_flutter_bin")")"
          set +e
          arch -x86_64 /bin/bash "$sra_flutter_bin" --version > diagnostics/flutter-bootstrap.log 2>&1
          bootstrap_status=$?
          set -e
          cat diagnostics/flutter-bootstrap.log
          if [ "$bootstrap_status" -ne 0 ]; then
            echo 'El arranque falló. Ejecutando pub con trazas dentro del SDK, sin modificar SRA.'
            set +e
            (
              cd "$sra_sdk_root/packages/flutter_tools"
              arch -x86_64 /bin/bash "$sra_sdk_root/bin/cache/dart-sdk/bin/pub" \
                --trace --verbosity=all upgrade --no-precompile
            ) > diagnostics/flutter-pub-trace.log 2>&1
            trace_status=$?
            set -e
            printf 'pub trace exit code: %s\n' "$trace_status"
            tail -n 180 diagnostics/flutter-pub-trace.log
            exit "$bootstrap_status"
          fi
          cp diagnostics/flutter-bootstrap.log diagnostics/flutter-version.txt
          flutter --version --machine > diagnostics/flutter-version.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          info = json.loads(Path('diagnostics/flutter-version.json').read_text())
          assert info['frameworkVersion'] == '1.12.13+hotfix.9', info
          assert info['dartSdkVersion'].split()[0] == '2.7.2', info
          PY
          xcodebuild -version | tee diagnostics/xcode-version.txt
          pod --version | tee diagnostics/cocoapods-version.txt
          uname -m | tee diagnostics/architecture.txt
      - name: Resolver dependencias conservando el lockfile
        script: |
          set -euo pipefail
          shasum -a 256 pubspec.lock | tee diagnostics/lock-before.txt
          set +e
          flutter pub get 2>&1 | tee diagnostics/pub-get.log
          pub_status=${PIPESTATUS[0]}
          set -e
          shasum -a 256 pubspec.lock | tee diagnostics/lock-after.txt
          git diff -- pubspec.lock > diagnostics/lock.diff
          if ! cmp -s diagnostics/lock-before.txt diagnostics/lock-after.txt; then
            echo 'ERROR: pub get modificó pubspec.lock; revisar diagnostics/lock.diff.'
            exit 1
          fi
          exit "$pub_status"
      - name: Compilar iOS debug sin firma
        script: |
          set -euo pipefail
          flutter build ios --debug --no-codesign 2>&1 | tee diagnostics/ios-build.log
    artifacts:
      - diagnostics/**
      - build/ios/iphoneos/*.app
