# Rama migration/ios-26: comprobación release sin firma ni publicación.
workflows:
  # Mantener el ID que Codemagic ya tiene guardado para esta aplicación.
  ios-diagnostico:
    name: SRA - iOS 26 release sin firma
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: "26.3"
      vars:
        SRA_API_BASE_URL: "http://192.168.1.82:8080"
    scripts:
      - name: Instalar Flutter 3.38.10 fijado
        script: |
          set -euo pipefail
          sra_flutter_dir="$(mktemp -d "${TMPDIR:-/tmp}/sra-flutter-modern.XXXXXX")"
          git clone --depth 1 --branch 3.38.10 https://github.com/flutter/flutter.git "$sra_flutter_dir"
          test "$(git -C "$sra_flutter_dir" rev-parse HEAD)" = c6f67dede3d4aa1aa7a69dd56a3494a5cde6cc80
          printf 'PATH=%s/bin:%s\n' "$sra_flutter_dir" "$PATH" >> "$CM_ENV"
      - name: Verificar entorno moderno
        script: |
          set -euo pipefail
          mkdir -p diagnostics
          flutter --version --machine > diagnostics/flutter-version.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          info = json.loads(Path('diagnostics/flutter-version.json').read_text())
          assert info['frameworkVersion'] == '3.38.10', info
          PY
          xcodebuild -version | tee diagnostics/xcode-version.txt
          sw_vers | tee diagnostics/macos-version.txt
      - name: Resolver dependencias fijadas
        script: |
          set -euo pipefail
          flutter pub get --enforce-lockfile 2>&1 | tee diagnostics/pub-get.log
          git diff --exit-code -- pubspec.lock
      - name: Analizar y probar la migración
        script: |
          set -euo pipefail
          flutter analyze 2>&1 | tee diagnostics/analyze.log
          flutter test --reporter expanded 2>&1 | tee diagnostics/test.log
      - name: Compilar release iOS sin firma
        script: |
          set -euo pipefail
          flutter build ios --release --no-codesign \
            --dart-define="SRA_API_BASE_URL=$SRA_API_BASE_URL" \
            2>&1 | tee diagnostics/ios-release-build.log
          test -s build/ios/iphoneos/Runner.app/Runner
    artifacts:
      - diagnostics/**
      - build/ios/iphoneos/*.app
